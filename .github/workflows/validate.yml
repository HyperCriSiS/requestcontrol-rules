name: Validate rules

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - run: node scripts/curation-selftest.mjs
      - run: node scripts/promotion-selftest.mjs
      - run: node scripts/review-candidates.mjs fixtures/curation/selftest-candidates.json > /tmp/curation-review.json
