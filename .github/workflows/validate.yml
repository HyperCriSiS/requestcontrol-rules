name: Validate rules

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - run: node scripts/curation-selftest.mjs
      - run: node scripts/review-candidates.mjs fixtures/curation/selftest-candidates.json > /tmp/curation-review.json
